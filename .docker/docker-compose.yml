services:
  app:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    image: postwise:local
    container_name: postwise
    ports:
      - "7860:7860"
    env_file:
      - ../.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s